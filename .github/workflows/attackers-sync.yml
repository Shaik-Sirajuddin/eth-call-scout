name: Refresh attacker list

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ./scripts/build-attacker-list.js
      - name: Open a pull request if addresses changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/attacker-addresses.json; then
            echo "No new attacker addresses."
            exit 0
          fi
          branch="attackers/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/attacker-addresses.json
          git commit -m "chore: refresh attacker list"
          git push --force origin "$branch"
          gh pr create --title "Refresh attacker list" --body "Daily refresh from the public feeds listed in data/attacker-addresses.json. Merge to publish it through the free API." --head "$branch" || echo "A pull request for this branch already exists."
