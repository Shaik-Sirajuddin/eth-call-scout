name: Secu contract call review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: secu-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Compare configured example scans
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install trusted analyzer dependencies and build Rust scanner
        working-directory: base
        run: |
          npm ci --ignore-scripts
          npm run build:parser
      - name: Install candidate dependencies for import resolution
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Validate and load the trusted base ruleset
        id: terms
        env:
          RULESET: ${{ github.workspace }}/base/.secu
        run: |
          node -e "const fs=require('node:fs');const rules=JSON.parse(fs.readFileSync(process.env.RULESET,'utf8'));if(rules.version!==1||!Array.isArray(rules.scanPaths)||rules.scanPaths.length===0)throw Error('Invalid trusted .secu ruleset');for(const p of rules.scanPaths)if(typeof p!=='string'||p.startsWith('/')||p.split(/[\\/]/).includes('..'))throw Error('Invalid .secu scan path: '+p);console.log('Validated .secu v1 ruleset from the PR base revision.')"
          mapfile -t SCAN_PATHS < <(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(process.env.RULESET,'utf8')).scanPaths.join('\n'))")
          printf '%s\n' "${SCAN_PATHS[@]}" > "$GITHUB_WORKSPACE/secu-scan-paths.txt"
      - name: Scan base examples with the trusted analyzer and ruleset
        working-directory: base
        env:
          RULESET: ${{ github.workspace }}/base/.secu
          SCAN_PATHS_FILE: ${{ github.workspace }}/secu-scan-paths.txt
          BASE_DIR: ${{ github.workspace }}/base
        run: |
          mapfile -t SCAN_PATHS < "$SCAN_PATHS_FILE"
          BASE_PATHS=()
          for scan_path in "${SCAN_PATHS[@]}"; do BASE_PATHS+=("$BASE_DIR/$scan_path"); done
          node "$BASE_DIR/bin/eth-call-scout.js" "${BASE_PATHS[@]}" --ruleset "$RULESET" --no-html --json "$GITHUB_WORKSPACE/base-report.json"
      - name: Scan proposed examples with the trusted analyzer and ruleset
        working-directory: base
        env:
          RULESET: ${{ github.workspace }}/base/.secu
          SCAN_PATHS_FILE: ${{ github.workspace }}/secu-scan-paths.txt
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: |
          mapfile -t SCAN_PATHS < "$SCAN_PATHS_FILE"
          CANDIDATE_PATHS=()
          for scan_path in "${SCAN_PATHS[@]}"; do CANDIDATE_PATHS+=("$CANDIDATE_DIR/$scan_path"); done
          node "$GITHUB_WORKSPACE/base/bin/eth-call-scout.js" "${CANDIDATE_PATHS[@]}" --ruleset "$RULESET" --no-html --json "$GITHUB_WORKSPACE/head-report.json"
      - name: Create Markdown diff
        working-directory: base
        run: node scripts/diff-reports.js "$GITHUB_WORKSPACE/base-report.json" "$GITHUB_WORKSPACE/head-report.json" "$GITHUB_WORKSPACE/secu-review.md"
      - name: Upload review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: secu-review-${{ github.event.pull_request.number }}
          path: secu-review.md
          if-no-files-found: error
          retention-days: 7
