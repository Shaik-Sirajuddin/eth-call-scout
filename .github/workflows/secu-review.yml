name: Secu contract call review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: secu-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Compare configured example scans
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install dependencies and build Rust scanner
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npm run build:parser
      - name: Share installed packages with the base checkout
        run: ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/base/node_modules"
      - name: Scan base examples with the PR analyzer
        working-directory: candidate
        env:
          BASE_DIR: ${{ github.workspace }}/base
          RULESET: ${{ github.workspace }}/candidate/.secu
        run: |
          mapfile -t SCAN_PATHS < <(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(process.env.RULESET,'utf8')).scanPaths.join('\n'))")
          BASE_PATHS=()
          for scan_path in "${SCAN_PATHS[@]}"; do BASE_PATHS+=("$BASE_DIR/$scan_path"); done
          node bin/eth-call-scout.js "${BASE_PATHS[@]}" --ruleset "$RULESET" --no-html --json "$GITHUB_WORKSPACE/base-report.json"
      - name: Scan proposed examples
        working-directory: candidate
        run: |
          mapfile -t SCAN_PATHS < <(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync('.secu','utf8')).scanPaths.join('\n'))")
          node bin/eth-call-scout.js "${SCAN_PATHS[@]}" --ruleset .secu --no-html --json "$GITHUB_WORKSPACE/head-report.json"
      - name: Create Markdown diff
        working-directory: candidate
        run: node scripts/diff-reports.js "$GITHUB_WORKSPACE/base-report.json" "$GITHUB_WORKSPACE/head-report.json" "$GITHUB_WORKSPACE/secu-review.md"
      - name: Upload review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: secu-review-${{ github.event.pull_request.number }}
          path: secu-review.md
          if-no-files-found: error
          retention-days: 7
